name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MYPY_CACHE_DIR: ${{ runner.temp }}/mypy-cache
      PYTEST_ADDOPTS: --cache-dir=${{ runner.temp }}/pytest-cache
      RUFF_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make lint
      - run: make typecheck
      - run: make test
